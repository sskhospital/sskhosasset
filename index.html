/* ========================================================
   ROBUST DATABASE SANITIZER & SCHEMA GUARD
   ป้องกันข้อผิดพลาดจากการเพิ่ม/ลบ/แก้ไขข้อมูลในฐานข้อมูล
======================================================== */
function sanitizeDB(raw){
  const s = seed();
  if(!raw || typeof raw !== 'object') return s;

  const toArr = (val, fb = []) => {
    if(!val) return fb;
    if(Array.isArray(val)) return val.filter(x => x !== null && x !== undefined);
    if(typeof val === 'object') return Object.values(val).filter(x => x !== null && x !== undefined);
    return fb;
  };

  const clean = {
    cfg: Object.assign({}, s.cfg, raw.cfg || {}),
    log: toArr(raw.log),
    users: toArr(raw.users, s.users),
    eq: toArr(raw.eq, s.eq),
    pt: toArr(raw.pt, s.pt),
    rq: toArr(raw.rq, s.rq),
    ann: toArr(raw.ann, s.ann)
  };

  if(!clean.users.length) clean.users = s.users;
  clean.users = clean.users.map((u, i) => ({
    id: String(u.id || 'u' + (i + 1)),
    u: String(u.u || 'user' + (i + 1)),
    p: String(u.p ?? '123456'),
    name: String(u.name || u.u || 'ผู้ใช้'),
    role: (['admin','head','tech','staff'].includes(u.role) ? u.role : 'staff')
  }));

  clean.eq = clean.eq.map((e, i) => ({
    id: String(e.id || 'e' + (i + 1)),
    code: String(e.code || 'EQ-' + String(i + 1).padStart(3, '0')),
    name: String(e.name || 'ครุภัณฑ์ ' + (i + 1)),
    dept: String(e.dept || 'ทั่วไป'),
    loc: String(e.loc || '-'),
    status: (['ปกติ','ซ่อม','จำหน่าย'].includes(e.status) ? e.status : 'ปกติ'),
    cat: String(e.cat || 'ครุภัณฑ์วิทยาศาสตร์และการแพทย์'),
    brand: String(e.brand || ''),
    model: String(e.model || ''),
    serial: String(e.serial || ''),
    price: Number(e.price) || 0,
    photo: String(e.photo || '')
  }));

  clean.pt = clean.pt.map((p, i) => ({
    id: String(p.id || 'p' + (i + 1)),
    name: String(p.name || 'อะไหล่ ' + (i + 1)),
    qty: Math.max(0, Number(p.qty) || 0),
    min: Math.max(0, Number(p.min) || 0),
    unit: String(p.unit || 'ชิ้น')
  }));

  clean.rq = clean.rq.map((r, i) => ({
    id: String(r.id || uid()),
    eq: String(r.eq || ''),
    by: String(r.by || ''),
    date: String(r.date || today()),
    prob: String(r.prob || 'ไม่ระบุอาการ'),
    pri: (['ต่ำ','ปานกลาง','สูง'].includes(r.pri) ? r.pri : 'ปานกลาง'),
    st: (['pending','approved','inprogress','done','rejected'].includes(r.st) ? r.st : 'pending'),
    tech: String(r.tech || ''),
    cost: Math.max(0, Number(r.cost) || 0),
    note: String(r.note || ''),
    done: String(r.done || ''),
    rate: Number(r.rate) || 0,
    cm: String(r.cm || ''),
    rt: r.rt && typeof r.rt === 'object' ? {
      sp: Number(r.rt.sp) || 0,
      ql: Number(r.rt.ql) || 0,
      sv: Number(r.rt.sv) || 0
    } : null
  }));

  clean.ann = clean.ann.map((a, i) => ({
    id: String(a.id || 'a' + (i + 1)),
    lv: (['info','warn','danger'].includes(a.lv) ? a.lv : 'info'),
    t: String(a.t || ''),
    d: String(a.d || today())
  }));

  return clean;
}

    if(saved) return JSON.parse(saved);
  }catch(e){}
  if(window.firebaseConfig && window.firebaseConfig.apiKey && window.firebaseConfig.apiKey !== 'YOUR_API_KEY'){
    return window.firebaseConfig;
  }
  return null;
}

function initFirebase(){
  const cfg = getActiveFbConfig();
  if(!cfg || !window.firebase){
    fbStatus = 'offline';
    updateStatusBadge();
    return;
  }
  try{
    if(!firebase.apps.length){
      fbApp = firebase.initializeApp(cfg);
    }else{
      fbApp = firebase.app();
    }
    fbDb = firebase.database();
    fbRef = fbDb.ref('sk_db');

    fbDb.ref('.info/connected').on('value', snap=>{
      fbStatus = (snap.val() === true) ? 'online' : 'offline';
      updateStatusBadge();
    });

    fbRef.on('value', snap=>{
      const val = snap.val();
      if(val && typeof val === 'object'){
        isRemoteUpdate = true;
        D = sanitizeDB(val);
        try{ localStorage.setItem('sk_db', JSON.stringify(D)); }catch(e){}
        isRemoteUpdate = false;
        render();
      }else if(val === null){
        fbRef.set(cleanObj(D)).catch(err=>console.warn('Init Firebase seed error:', err));
      }
    }, err=>{
      console.warn('Firebase sync error:', err);
      fbStatus = (err.code === 'PERMISSION_DENIED') ? 'error' : 'offline';
      updateStatusBadge();
    });
  }catch(e){
    console.error('Firebase init failed:', e);
    fbStatus = 'error';
    updateStatusBadge();
  }
}

// ฟังก์ชันบันทึกข้อมูล ป้องกันข้อผิดพลาด synchronous
const save=()=>{
  D = sanitizeDB(D);
  try{
    localStorage.setItem('sk_db', JSON.stringify(D));
  }catch(e){
    console.warn('LocalStorage save error:', e);
  }
  if(!isRemoteUpdate && fbRef && fbStatus === 'online'){
    try{
      fbRef.set(cleanObj(D)).catch(err=>{
        console.warn('Cloud sync error:', err);
        if(err.code === 'PERMISSION_DENIED'){
          fbStatus = 'error';
          updateStatusBadge();
        }
      });
    }catch(e){
      console.error('Firebase set synchronous exception:', e);
    }
  }
};

function updateStatusBadge(){
  const el = document.getElementById('fb-status-btn');
  if(!el) return;
  el.className = 'fb-badge ' + fbStatus;
  let text = 'โหมด LocalStorage';
  if(fbStatus === 'online') text = '🟢 Firebase: ซิงค์สด';
  else if(fbStatus === 'error') text = '🔴 Firebase: สิทธิ์ไม่ถูกต้อง (ตรวจ Rules)';
  else if(fbStatus === 'connecting') text = '🟡 Firebase: กำลังเชื่อมต่อ...';
  el.innerHTML = `<span class="dot"></span> ${text}`;
}

const rc = r => {

function stats(m){
  const M = D.rq.filter(r => (r.date || '').slice(0, 7) === m);
  const dn = M.filter(r => r.st === 'done');
  const rt = M.filter(r => r.rate > 0);
  const dd = dn.filter(r => r.done && r.date).map(r => (new Date(r.done) - new Date(r.date)) / 864e5).filter(d => !isNaN(d) && d >= 0);
  const c = {}, k = {};
  M.forEach(r => {
    const name = E(r.eq);
    c[name] = (c[name] || 0) + 1;
    const eqObj = D.eq.find(e => e.id === r.eq);
    const cat = (eqObj?.cat || 'ทั่วไป').replace('ครุภัณฑ์', '');
    k[cat] = (k[cat] || 0) + 1;
  });
  return {
    cats: Object.entries(k),
    n: M.length,
    rate: M.length ? Math.round(dn.length / M.length * 100) : 0,
    days: dd.length ? (dd.reduce((a, b) => a + b, 0) / dd.length).toFixed(1) : '-',
    cost: dn.reduce((s, r) => s + (Number(r.cost) || 0), 0),
    sat: rt.length ? (rt.reduce((s, r) => s + Number(r.rate), 0) / rt.length).toFixed(2) : '-',
    top: Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5),
    st: Object.keys(ST).map(key => [key, M.filter(r => r.st === key).length]),
    dist: [5, 4, 3, 2, 1].map(star => [star + ' ดาว', rt.filter(r => Math.round(r.rate) === star).length])
  };
}

function bi(){
  const m=window.bm||today().slice(0,7),s=stats(m),mk=[];
  for(let i=5;i>=0;i--){
    const d=new Date();
    d.setDate(1);
    d.setMonth(d.getMonth()-i);
    mk.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const tr=mk.map(k=>[k.slice(2),stats(k)]),mx=Math.max(1,...tr.map(t=>t[1].n)),tot=Math.max(1,s.n);
  let acc=0;
  const cg=s.st.map(([k,n])=>{const a=acc/tot*100;acc+=n;return`${SC[k]} ${a}% ${acc/tot*100}%`}).join(',');
  return`<div class="card bi"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h3 style="margin:0">📈 Executive BI &amp; รายงานสรุปประจำเดือน</h3><span><input type="month" style="width:auto" value="${m}" onchange="bm=this.value;render()"><button class="btn" onclick="printBI()">🖨 พิมพ์รายงานผู้บริหาร</button></span></div>
  <div class="ins">💡 เดือน ${m} มีงานซ่อม <b>${s.n}</b> งาน ซ่อมเสร็จ <b>${s.rate}%</b> เวลาซ่อมเฉลี่ย <b>${s.days}</b> วัน ค่าซ่อมรวม <b>${s.cost.toLocaleString()}</b> บาท · เครื่องที่แจ้งซ่อมบ่อยสุด: <b>${esc(s.top[0]?.[0]||'-')}</b> · ${low().length?'อะไหล่ใกล้หมด '+low().length+' รายการ ควรเร่งจัดซื้อ':'สต็อกอะไหล่อยู่ในเกณฑ์ปกติ'} · งานด่วนมากที่ยังค้าง ${D.rq.filter(r=>r.pri=='สูง'&&r.st!='done'&&r.st!='rejected').length} งาน</div>
  <div class="g" style="margin-bottom:14px"><div class="k k1"><i>🛠</i><b>${s.n}</b><span>งานซ่อมทั้งหมด</span></div><div class="k k4"><i>✅</i><b>${s.rate}%</b><span>อัตราซ่อมเสร็จ</span></div><div class="k k3"><i>⏱</i><b>${s.days}</b><span>เวลาซ่อมเฉลี่ย (วัน)</span></div><div class="k k2"><i>💰</i><b>${s.cost.toLocaleString()}</b><span>ค่าซ่อม (บาท)</span></div><div class="k k6"><i>⭐</i><b>${s.sat}</b><span>พึงพอใจเฉลี่ย</span></div></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="pn"><b>แนวโน้ม 6 เดือน (จำนวนงาน)</b><div class="tr">${tr.map((t,i)=>`<div>${t[1].n}<div class="cb" style="height:${t[1].n/mx*100}px;background:linear-gradient(${PAL[i%6]}bb,${PAL[i%6]})"></div>${t[0]}</div>`).join('')}</div></div>

function pushToFirebase(){
  if(!fbRef){
    alert('ยังไม่ได้เชื่อมต่อ Firebase หรือยังไม่ได้ระบุ Firebase Config');
    return;
  }
  if(confirm('ต้องการนำข้อมูลจากเครื่องนี้ อัปโหลดขึ้นทับบน Firebase ใช่หรือไม่?')){
    fbRef.set(cleanObj(D)).then(()=>{
      alert('สำรองข้อมูลขึ้น Firebase Realtime Database สำเร็จแล้ว!');
    }).catch(e=>alert('เกิดข้อผิดพลาด: ' + e.message));
  }
}

function pullFromFirebase(){
  if(!fbRef){
    alert('ยังไม่ได้เชื่อมต่อ Firebase');
    return;
  }
  fbRef.once('value').then(snap=>{
    const v = snap.val();
    if(v){
      D = sanitizeDB(v);
      save();
      render();
      alert('ดึงข้อมูลล่าสุดจาก Firebase สำเร็จแล้ว');
    }else{
      alert('ฐานข้อมูลบน Firebase ยังไม่มีข้อมูล');
    }
  }).catch(e=>alert('เกิดข้อผิดพลาด: ' + e.message));
}

const IMGF=(x,v)=>`<input type="hidden" id="f_${x.k}" value="${esc(v[x.k]||'')}"><input type="file" accept="image/*" id="fi_${x.k}"><img id="pv_${x.k}" src="${esc(v[x.k]||'')}" style="display:${v[x.k]?'block':'none'};max-width:160px;border-radius:12px;margin-top:8px" alt="">`;

function BINDIMG(m,f){
  f.filter(x=>x.t=='img').forEach(x=>{
    const fi=m.querySelector('#fi_'+x.k);
    if(!fi) return;
    fi.onchange=()=>{
      if(!fi.files[0])return;
      const r=new FileReader();
      r.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const c=document.createElement('canvas');
          const k=Math.min(1,360/Math.max(im.width,im.height));
          c.width=im.width*k;
          c.height=im.height*k;
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          const u=c.toDataURL('image/jpeg',.72);
          m.querySelector('#f_'+x.k).value=u;
          const p=m.querySelector('#pv_'+x.k);
          if(p){ p.src=u; p.style.display='block'; }
        };
        im.src=r.result;
      };
      r.readAsDataURL(fi.files[0]);
    };
  });
}

function rate(id){

  if(!r)return;
  const o5=[[5,'5 - มากที่สุด'],[4,'4 - มาก'],[3,'3 - ปานกลาง'],[2,'2 - น้อย'],[1,'1 - น้อยที่สุด']];

    {k:'sp',l:'ความรวดเร็วในการซ่อม',t:'select',o:o5},
    {k:'ql',l:'คุณภาพงานซ่อม / เครื่องใช้งานได้ดี',t:'select',o:o5},
    {k:'sv',l:'มารยาทและการให้บริการของช่าง',t:'select',o:o5},
    {k:'cm',l:'ข้อเสนอแนะเพิ่มเติม',t:'textarea'}
  ],o=>{
    const a=[Number(o.sp)||5, Number(o.ql)||5, Number(o.sv)||5];
    r.rt = {sp:a[0], ql:a[1], sv:a[2]};
    r.rate = Math.round((a[0]+a[1]+a[2])/3 * 10) / 10;
    r.cm = String(o.cm || '').trim();
    save();
  });
}

function setSt(id,s){
  const r=D.rq.find(x=>x.id==id);
  if(!r)return;
  r.st=s;
  const e=D.eq.find(x=>x.id==r.eq);
  if(e&&s=='inprogress')e.status='ซ่อม';
  if(s=='inprogress')r.tech=me.id;
  save();
  render();
}

function finish(id){
  const r=D.rq.find(x=>x.id==id);
  if(!r)return;
  form('บันทึกผลซ่อม',[
    {k:'note',l:'วิธีแก้ไข',t:'textarea'},
    {k:'cost',l:'ค่าใช้จ่าย (บาท)',t:'number'},
    {k:'pid',l:'อะไหล่ที่ใช้',t:'select',o:[['','— ไม่ใช้อะไหล่ —'],...D.pt.map(p=>[p.id,p.name+' (คงเหลือ '+p.qty+' '+p.unit+')'])]},
    {k:'q',l:'จำนวนอะไหล่ที่ใช้',t:'number'}
  ],o=>{
    if(o.pid){
      const p=D.pt.find(x=>x.id==o.pid);
      if(p){
        const q = Math.max(0, Number(o.q)||0);
        if(q > p.qty) return alert('จำนวนอะไหล่ในสต็อกไม่เพียงพอ (คงเหลือ ' + p.qty + ')')||false;
        p.qty -= q;
      }
    }
    r.st = 'done';
    r.note = String(o.note || '');
    r.cost = Math.max(0, Number(o.cost) || 0);
    r.done = today();
    r.tech = me.id;
    const e=D.eq.find(x=>x.id==r.eq);
    if(e) e.status = 'ปกติ';
    save();
  });
}

    {k:'photo',l:'รูปภาพครุภัณฑ์',t:'img'},
    {k:'name',l:'ชื่อครุภัณฑ์'},
    {k:'brand',l:'ยี่ห้อ (Brand)'},
    {k:'model',l:'รุ่น (Model)'},
    {k:'serial',l:'Serial Number'},
    {k:'dept',l:'หน่วยงาน / แผนก'},
    {k:'loc',l:'ที่ตั้ง'},
    {k:'price',l:'ราคาจัดซื้อ (บาท)',t:'number'},
    {k:'status',l:'สถานะ',t:'select',o:['ปกติ','ซ่อม','จำหน่าย']}
  ],o=>{
    if(!o.name)return alert('กรุณากรอกชื่อครุภัณฑ์')||false;
    if(!o.code)o.code = 'EQ-' + String(D.eq.length + 1).padStart(3, '0');
    o.price = Math.max(0, Number(o.price) || 0);
    if(id){
      Object.assign(e,o);
    }else{
      D.eq.push({id:uid(),...o});
    }
    save();
  },e);
}

function ptForm(id){
  const p=D.pt.find(x=>x.id==id)||{};
  form(id?'แก้ไขอะไหล่':'เพิ่มอะไหล่',[
    {k:'name',l:'ชื่ออะไหล่'},
    {k:'qty',l:'คงเหลือ',t:'number'},
    {k:'min',l:'จุดสั่งซื้อขั้นต่ำ',t:'number'},
    {k:'unit',l:'หน่วย'}
  ],o=>{
    if(!o.name)return alert('กรุณากรอกชื่ออะไหล่')||false;
    o.qty = Math.max(0, Number(o.qty) || 0);
    o.min = Math.max(0, Number(o.min) || 0);
    if(!o.unit) o.unit = 'ชิ้น';
    id?Object.assign(p,o):D.pt.push({id:uid(),...o});
    save();
  },p);
}

function usForm(id){
  const u=D.users.find(x=>x.id==id)||{};
  form(id?'แก้ไขผู้ใช้':'เพิ่มผู้ใช้',[
    {k:'u',l:'ชื่อผู้ใช้ (Username)'},
    {k:'p',l:'รหัสผ่าน (Password)'},
    {k:'name',l:'ชื่อ-สกุล'},
    {k:'role',l:'สิทธิ์การใช้งาน',t:'select',o:Object.entries(RL)}
  ],o=>{
    o.u = String(o.u || '').trim();
    o.p = String(o.p || '').trim();
    o.name = String(o.name || '').trim();
    if(!o.u||!o.p)return alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน')||false;
    if(!id && D.users.some(x=>x.u.toLowerCase() === o.u.toLowerCase())){
      return alert('ชื่อผู้ใช้นี้มีในระบบแล้ว กรุณาใช้ชื่ออื่น')||false;
    }
    id?Object.assign(u,o):D.users.push({id:uid(),...o});
    save();
  },u);
}

function pr(id){
  const r=D.rq.find(x=>x.id==id),e=D.eq.find(x=>x.id==r?.eq)||{},c=CFG();
  if(!r) return alert('ไม่พบข้อมูลงานซ่อม');
  $('#pf').innerHTML=`<div style="text-align:center"><img src="${c.logo}" width="70" style="border-radius:50%"></div><h2 style="text-align:center">ใบแจ้งส่งซ่อมครุภัณฑ์<br>${esc(c.hospName)}</h2>${c.phone?`<p style="text-align:center;font-size:13px;margin:-8px 0 12px">โทร. ${esc(c.phone)}</p>`:''}<table><tr><th>เลขที่</th><td>${rc(r)}</td><th>วันที่</th><td>${r.date}</td></tr><tr><th>ความเร่งด่วน</th><td colspan="3">${PL[r.pri]||r.pri}</td></tr><tr><th>ครุภัณฑ์</th><td>${esc(e.code||'')} ${esc(e.name||'')}</td><th>หน่วยงาน</th><td>${esc(e.dept||'')}</td></tr><tr><th>อาการ</th><td colspan="3">${esc(r.prob)}</td></tr><tr><th>ผู้แจ้ง</th><td>${U(r.by)}</td><th>สถานะ</th><td>${ST[r.st]||r.st}</td></tr></table><br><br><table style="border:0"><tr><td style="border:0;text-align:center">ลงชื่อ.................ผู้แจ้ง</td><td style="border:0;text-align:center">ลงชื่อ.................ผู้อนุมัติ</td><td style="border:0;text-align:center">ลงชื่อ.................ช่างผู้รับงาน</td></tr></table>`;
  window.print();
}

window.print0=()=>{
  const R=window.RR||[],c=CFG();
  $('#pf').innerHTML=`<h2>รายงานสรุปงานซ่อมบำรุง ${esc(c.hospName)}</h2><table><tr><th>วันที่</th><th>ครุภัณฑ์</th><th>อาการ</th><th>สถานะ</th><th>ค่าซ่อม</th></tr>`+R.map(r=>`<tr><td>${r.date}</td><td>${esc(E(r.eq))}</td><td>${esc(r.prob)}</td><td>${ST[r.st]||r.st}</td><td>${r.cost||0}</td></tr>`).join('')+'</table>';
  window.print();
};

function cp(){
  const t=['วันที่\tครุภัณฑ์\tอาการ\tสถานะ\tค่าซ่อม\tคะแนน',...(window.RR||[]).map(r=>[r.date,E(r.eq),r.prob,ST[r.st]||r.st,r.cost||0,r.rate||''].join('\t'))].join('\n');
  try{navigator.clipboard.writeText(t).then(()=>alert('คัดลอกแล้ว วางใน Excel ได้เลย'))}catch(e){prompt('คัดลอกข้อความนี้',t)}
}

initFirebase();
render();
</script></body></html>
